name: Build E404 Kernel

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Branch to build"
        required: true
        default: "staging-bpf"
      resukisu_tag:
        description: "ReSukiSU tag/commit (blank = latest main)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Clone Kernel Source
        run: |
          git clone \
            --recursive \
            --depth=1 \
            -b "${{ github.event.inputs.kernel_branch }}" \
            https://github.com/dumpcode404/xiaomi_sm8250_kernel_e404_fork.git kernel

      - name: Remove Old KernelSU
        working-directory: kernel
        run: |
          echo "=== Removing old KernelSU ==="

          # Remove submodule if present
          git rm -f KernelSU 2>/dev/null || true
          rm -rf KernelSU/

          # Remove symlink
          rm -f drivers/kernelsu

          # Clean Makefile/Kconfig references
          sed -i '/kernelsu/d' drivers/Makefile 2>/dev/null || true
          sed -i '/drivers\/kernelsu\/Kconfig/d' drivers/Kconfig 2>/dev/null || true

          echo "=== Old KernelSU removed ==="

      - name: Debug
        run: |
          cd kernel

          echo "Current branch:"
          git rev-parse --abbrev-ref HEAD

          echo
          echo "Kernel version:"
          head -5 Makefile

          echo
          echo "Defconfig list:"
          ls arch/arm64/configs/vendor | grep munch || true

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libssl-dev \
            lld \
            patch \
            python3 \
            zstd \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

      - name: Download Neutron Clang
        run: |
          wget -O clang.tar.zst \
            https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst

          mkdir -p clang
          tar --zstd -xf clang.tar.zst -C clang

          echo "=== TOOLCHAIN STRUCTURE ==="
          find clang | head -50

      - name: Setup Toolchain
        run: |
          CLANG_DIR=$(find $GITHUB_WORKSPACE/clang -type d -name bin | head -1)

          echo "CLANG_DIR=$CLANG_DIR"

          export PATH=$CLANG_DIR:$PATH

          which clang
          clang --version

          echo "PATH=$PATH" >> $GITHUB_ENV

      - name: Setup ReSukiSU
        working-directory: kernel
        run: |
          echo "=== Setting up ReSukiSU ==="

          TAG="${{ github.event.inputs.resukisu_tag }}"
          if [ -z "$TAG" ]; then
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          else
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s "$TAG"
          fi

          echo "=== Verify ReSukiSU ==="
          ls -la drivers/kernelsu 2>/dev/null || echo "ERROR: symlink missing"
          grep -c "KSU_SUSFS" KernelSU/kernel/Kconfig 2>/dev/null && echo "SUSFS Kconfig: OK" || echo "SUSFS Kconfig: MISSING"

      - name: Apply SuSFS Kernel Patches (4.19)
        working-directory: kernel
        run: |
          echo "=== Applying SuSFS patches for kernel 4.19 ==="

          # Clone SUSFS patches (kernel-4.19 branch)
          git clone --depth=1 -b kernel-4.19 \
            https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu

          # Copy SUSFS source files into kernel tree
          echo "Copying SUSFS source files..."
          cp /tmp/susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp /tmp/susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/

          echo "Files copied:"
          ls -la fs/susfs.c include/linux/susfs.h

          # Apply kernel-side SUSFS patch
          # This patches: fs/Makefile, fs/Kconfig, fs/namespace.c,
          # fs/proc/task_mmu.c, fs/proc/base.c, fs/open.c, fs/stat.c,
          # include/linux/sched.h
          echo "Applying kernel-side SUSFS patch..."
          cp /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch .
          patch -p1 --no-backup-if-mismatch < 50_add_susfs_in_kernel-4.19.patch || {
            echo ""
            echo "=========================================="
            echo "WARN: Some SUSFS patch hunks may have failed."
            echo "Checking for .rej files..."
            echo "=========================================="
            REJ_COUNT=$(find . -name "*.rej" | wc -l)
            if [ "$REJ_COUNT" -gt 0 ]; then
              find . -name "*.rej" | while read f; do
                echo ""
                echo "--- REJECTED: $f ---"
                cat "$f"
              done
              echo ""
              echo "=========================================="
              echo "NOTE: Build will continue. If it fails,"
              echo "the rejected hunks need manual application."
              echo "=========================================="
            fi
          }

          # Cleanup
          rm -rf /tmp/susfs4ksu

          echo "=== SuSFS patching complete ==="

      - name: Enable ReSukiSU + SuSFS in Defconfig
        working-directory: kernel
        run: |
          DEFCONFIG="arch/arm64/configs/vendor/munch_defconfig"

          echo "=== Adding ReSukiSU + SuSFS config ==="

          # Only add if not already present
          if grep -q "CONFIG_KSU=y" "$DEFCONFIG"; then
            echo "CONFIG_KSU already present in defconfig"
          else
            cat >> "$DEFCONFIG" << 'EOF'

          #
          # ReSukiSU + SuSFS
          #
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          EOF
            echo "Config entries added to defconfig"
          fi

          # Show relevant lines
          echo "=== Relevant config ==="
          grep -E "CONFIG_KSU|CONFIG_KALLSYMS" "$DEFCONFIG" || true

      - name: Build Kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          make O=out vendor/munch_defconfig

          # Verify KSU and SUSFS are enabled in .config
          echo "=== Checking final .config ==="
          grep -E "CONFIG_KSU|CONFIG_KALLSYMS" out/.config || true

          make -j$(nproc) \
            O=out \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/kvsnr113/AnyKernel3.git AnyKernel3

      - name: Package Kernel
        run: |
          TARGET=MUNCH

          cp kernel/out/arch/arm64/boot/Image AnyKernel3/${TARGET}-Image
          cp kernel/out/arch/arm64/boot/dtb AnyKernel3/${TARGET}-dtb
          cp kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/${TARGET}-dtbo.img

          sed -i "s/devicename=.*/devicename=munch/" AnyKernel3/anykernel.sh

          cd AnyKernel3

          ZIP_NAME="RE404-POCO_F4-ReSukiSU-SuSFS-$(date +%y%m%d-%H%M).zip"

          zip -r9 "../${ZIP_NAME}" META-INF tools MUNCH-* anykernel.sh

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "RELEASE_TAG=build-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Verify ZIP
        run: |
          echo "Current dir:"
          pwd
          echo
          echo "ZIP files:"
          find . -name "*.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: E404-ReSukiSU-SuSFS-Kernel
          path: RE404-*.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
